marker_mark=#1b1b1f;#06b6ef;
call_tips=#080809;#E3E4E5
white_space=#94979b;#080809;true;false

# Programming languages
#-------------------------------------------------------------------------------

# comments
comment=#5bc4bf
comment_doc=#06b6ef
