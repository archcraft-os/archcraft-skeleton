# Theme Info
#-------------------------------------------------------------------------------
[theme_info]
name=Sweet Amber
description=A dark color-scheme, matching with Mountain style.
compat=1.22;1.23;1.23.1;1.24

[named_styles]
default=#E3E4E5;#080809;false;false
error=#ef6155;#080809;true;false

# Editor styles
#-------------------------------------------------------------------------------

