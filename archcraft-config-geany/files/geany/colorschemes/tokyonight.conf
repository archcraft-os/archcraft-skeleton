#-------------------------------------------------------------------------------

# Theme Info
#-------------------------------------------------------------------------------
[theme_info]
name=Tokyonight
description=A dark color-scheme, matching with keyboards style.
compat=1.22;1.23;1.23.1;1.24

[named_styles]
default=#a9b1d6;#22232E;false;false
error=#FF7A93;#22232E;true;false

# Editor styles
#-------------------------------------------------------------------------------

selection=#FFFFFF;#C50ED2;true;true
current_line=#a9b1d6;#2C2D38;true;false
brace_good=#22232E;#B9F27C;true;false
brace_bad=#22232E;#FF7A93;true;false
margin_line_number=#727BA5
margin_folding=#727BA5;#2C2D38
fold_symbol_highlight=#a9b1d6
indent_guide=#22232E
caret=#7DA6FF;#22232E;false
marker_line=#2C2D38;#7DA6FF;
marker_search=#2C2D38;#7DA6FF;
marker_mark=#2C2D38;#7DA6FF;
call_tips=#22232E;#a9b1d6
white_space=#727BA5;#22232E;true;false

# Programming languages
#-------------------------------------------------------------------------------

# comments
comment=#0DB9D7
comment_doc=#7DA6FF
comment_line=comment
comment_line_doc=comment_doc
