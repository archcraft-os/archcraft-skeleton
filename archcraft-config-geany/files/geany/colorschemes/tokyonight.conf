# keywords
keyword=#7DA6FF
keyword_1=keyword
keyword_2=type
keyword_3=keyword_1
keyword_4=keyword_1

# identifiers
identifier=default
identifier_1=identifier
identifier_2=identifier_1
identifier_3=identifier_1
identifier_4=identifier_1

# strings ""
string=#FF7A93
string_1=string
string_2=string_1
string_3=default
string_4=default
string_eol=#22232E;#a9b1d6
# strings ''
character=#B9F27C
# command `` or $()
backticks=#0FFF00
# heredoc
here_doc=#FF5DBB

scalar=#BBF545
label=default,bold
preprocessor=#FF9E64
regex=#FF5DBB
operator=#FF9E64
decorator=preprocessor
other=default
extra=#7DA6FF

# Markup-type languages
